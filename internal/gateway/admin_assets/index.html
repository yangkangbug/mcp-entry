<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>
      MCP Entry · 管理台
    </title>
    <link rel="stylesheet" href="/admin/assets/admin.css">
    <script src="/admin/assets/admin.js" defer>
    </script>
  </head>
  <body>
    <a class="skip" href="#main">
      Skip to content / 跳到内容
    </a>
    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="/admin">
          <span class="brand-mark" aria-hidden="true">
            M
          </span>
          <span>
            MCP Entry
            <small data-i18n="operator">
              管理控制台
            </small>
          </span>
        </a>
        <p class="eyebrow" data-i18n="workspace">
          工作空间
        </p>
        <nav id="navigation" aria-label="管理导航">
        </nav>
        <div class="sidebar-note">
          <span class="dot">
          </span>
          <span data-i18n="preview">
            合成环境预览
          </span>
          <p data-i18n="plane">
            管理接入与授权，不代替用户的 MCP 客户端。
          </p>
        </div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <span id="connection-state" class="badge" data-i18n="disconnected">
            未连接
          </span>
          <div class="top-actions">
            <label for="language" class="sr-only">
              语言 / Language
            </label>
            <select id="language">
              <option value="zh-CN">
                中文
              </option>
              <option value="en">
                English
              </option>
            </select>
            <button id="refresh" type="button" data-i18n="refresh" disabled>
              刷新
            </button>
            <button id="disconnect" type="button" data-i18n="disconnect" disabled>
              断开
            </button>
          </div>
        </header>
        <main id="main">
          <div class="page-heading">
            <p class="eyebrow">
              MCP ENTRY / ADMIN
            </p>
            <h1 id="page-title">
              概览
            </h1>
            <p id="page-description" class="lede">
            </p>
          </div>
          <section id="authentication" class="panel auth-panel">
            <div>
              <h2 data-i18n="connectTitle">
                连接管理平面
              </h2>
              <p data-i18n="connectHelp">
                使用启动时 -admin-token-file 指定的独立管理员 token；向实例运营者取得，不是用户网关 token 或服务凭据。仅保留在页面内存，断开后清除。
              </p>
            </div>
            <form id="login-form">
              <label for="admin-token" data-i18n="adminToken">
                管理员 token
              </label>
              <div class="inline-form">
                <input id="admin-token" type="password" autocomplete="off" spellcheck="false" required maxlength="4096">
                <button id="connect" type="submit" class="primary" data-i18n="connect">
                  连接
                </button>
              </div>
            </form>
          </section>
          <div id="message" role="status" aria-live="polite">
          </div>
          <div id="content">
          </div>
          <footer data-i18n="footer">
            秘密不进入 URL、浏览器持久存储或管理报表。服务状态是有限范围的观察，不是实时可用性承诺。
          </footer>
        </main>
      </div>
    </div>
  </body>
</html>
