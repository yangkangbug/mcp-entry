<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接你的账号 · MCP Entry</title><link rel="stylesheet" href="/account/assets/account.css"><script src="/account/assets/account.js" defer></script></head>
<body><main>
<div class="page-toolbar"><p class="label" data-i18n="label">MCP ENTRY · 本地测试</p><div class="language-picker"><label for="language" data-i18n="language">语言 / Language</label><select id="language"><option value="zh-CN" lang="zh-CN">中文</option><option value="en" lang="en">English</option></select></div></div>
<h1 data-i18n="heading">已连接的账号</h1>
<p data-i18n="intro">此页面用于首次连接或恢复访问，日常使用 MCP 时无需保持打开。当前本地原型仅用于虚构凭据测试。</p>
<section><h2 data-i18n="authenticate">1. 验证入口身份</h2><p data-i18n="entryHelp">输入预先配置的入口凭据。凭据仅保留在当前页面内存中，关闭页面或断开连接后会清除。</p>
<form id="login-form"><label for="entry" data-i18n="entryLabel">入口凭据</label><input id="entry" type="password" autocomplete="off" spellcheck="false" required maxlength="4096"><button type="submit" data-i18n="connect">连接</button><button type="button" id="disconnect" data-i18n="disconnect">断开连接</button></form></section>
<section><h2 data-i18n="manage">2. 管理本人绑定</h2><p id="identity"></p><button type="button" id="refresh" data-i18n="refresh" disabled>刷新状态</button><ul id="bindings"></ul>
<form id="binding-form"><label for="system" data-i18n="system">系统</label><select id="system" disabled required></select><label for="credential" data-i18n="credentialLabel">新的下游凭据</label><input id="credential" type="password" autocomplete="off" spellcheck="false" maxlength="4096" required disabled><label for="expiry" data-i18n="expiryLabel">到期时间（本地时间，可选）</label><input id="expiry" type="datetime-local" disabled><p data-i18n="providerHelp">请另行向下游服务获取新凭据。本页面不会签发凭据或自动刷新下游授权。</p><button type="submit" id="replace" data-i18n="replace" disabled>保存新凭据</button><button type="button" id="revoke" data-i18n="revoke" disabled>撤销所选绑定</button></form></section>
<p id="message" role="status" aria-live="polite">尚未连接。</p>
</main></body></html>
