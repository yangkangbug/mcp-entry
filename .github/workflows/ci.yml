name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Verify dependencies
        run: go mod download && go mod verify
      - name: Check admin console state and syntax
        run: |
          node --version
          node --check internal/gateway/admin_assets/admin.js
          node tests/admin-console/frontend.test.cjs
      - name: Check one-time binding page state and syntax
        run: |
          node --check internal/gateway/binding_assets/binding.js
          node tests/client-binding/frontend.test.cjs
      - name: Test
        run: go test -count=1 ./...
      - name: Test with race detector
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
